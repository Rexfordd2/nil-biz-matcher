name: CI Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint check
        run: npm run verify:lint

      - name: Build application
        run: npm run build
        env:
          # Ensure production build mode
          NODE_ENV: production
          # Build should fail if debug routes are not protected
          # (vite.config.ts plugin checks for VITE_DIAGNOSTICS or VITE_DEBUG_KEY)

  verify-prod:
    name: Production Verification
    runs-on: ubuntu-latest
    # Only run if DOMAINS and VERCEL_TOKEN secrets are present
    if: ${{ secrets.DOMAINS != '' && secrets.VERCEL_TOKEN != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify production domains
        run: npm run verify:prod
        env:
          DOMAINS: ${{ secrets.DOMAINS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
