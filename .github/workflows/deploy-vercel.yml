name: NIL Roster CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    name: NIL Roster CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run verify:lint

      - name: Run tests
        run: npm test

      - name: Flag-off Production build
        run: npm run build
        env:
          VITE_APP_MODE: beta
          VITE_PUBLIC_MODE: 'true'
          VITE_ALLOW_MISSING_GOOGLE_MAPS_KEY: 'true'
          VITE_WORKFLOW_CLOUD_PERSISTENCE: 'false'

      - name: Validation summary
        if: success()
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "tests=passed"
          echo "flag_off_build=passed"
          echo "deployment_owner=Vercel Git integration"
          echo "github_actions_deployment=none"
