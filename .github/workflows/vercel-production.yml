name: Vercel Production Deployment

on:
  push:
    branches:
      - main

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Assert secrets injected
        run: |
          ORG_ID_LENGTH=${#VERCEL_ORG_ID}
          PROJECT_ID_LENGTH=${#VERCEL_PROJECT_ID}
          TOKEN_LENGTH=${#VERCEL_TOKEN}
          
          echo "ORG_ID length: $ORG_ID_LENGTH"
          echo "PROJECT_ID length: $PROJECT_ID_LENGTH"
          echo "TOKEN length: $TOKEN_LENGTH"
          
          if [ "$ORG_ID_LENGTH" -eq 0 ] || [ "$PROJECT_ID_LENGTH" -eq 0 ] || [ "$TOKEN_LENGTH" -eq 0 ]; then
            echo "GitHub Secrets not being injected"
            exit 1
          fi
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify Vercel token + scope access (no secrets printed)
        run: |
          echo "ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "PROJECT_ID length: ${#VERCEL_PROJECT_ID}"
          echo "TOKEN length: ${#VERCEL_TOKEN}"
          npx vercel whoami --token=$VERCEL_TOKEN
          npx vercel teams ls --token=$VERCEL_TOKEN
      
      - name: Pull Vercel environment information
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      
      - name: Build project artifacts
        run: npx vercel build --prod --token=$VERCEL_TOKEN
      
      - name: Deploy prebuilt artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN 2>&1 | tee /dev/stderr | grep -oP 'https://[^\s]+' | tail -1)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $DEPLOYMENT_URL"
      
      - name: Print deployment info
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Git SHA (full): ${{ github.sha }}"
          echo "Git SHA (short): $(echo ${{ github.sha }} | cut -c1-7)"
          echo "Expected in /api/build-id: gitCommitSha should equal ${{ github.sha }}"

  verify:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment to propagate
        run: sleep 30
      
      - name: Check /api/healthz
        id: healthz
        run: |
          echo "Fetching https://athlete-ledger.vercel.app/api/healthz?cb=${{ github.run_id }}"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" "https://athlete-ledger.vercel.app/api/healthz?cb=${{ github.run_id }}")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ ERROR: /api/healthz returned HTTP $HTTP_CODE"
            exit 1
          fi
          RESPONSE=$(cat response.json)
          echo "Response: $RESPONSE"
          BUILD_ID=$(echo $RESPONSE | jq -r '.buildId')
          echo "buildId=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID from healthz: $BUILD_ID"
          
          # Fail if still serving old build
          if [ "$BUILD_ID" = "ac87f4b" ]; then
            echo "❌ FAILED: /api/healthz is still serving old build (ac87f4b)"
            exit 1
          fi
      
      - name: Check /api/build-id
        id: build_id
        run: |
          echo "Fetching https://athlete-ledger.vercel.app/api/build-id?cb=${{ github.run_id }}"
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" "https://athlete-ledger.vercel.app/api/build-id?cb=${{ github.run_id }}")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ ERROR: /api/build-id returned HTTP $HTTP_CODE"
            exit 1
          fi
          RESPONSE=$(cat response.json)
          echo "Response: $RESPONSE"
          BUILD_ID=$(echo $RESPONSE | jq -r '.buildId // empty')
          GIT_COMMIT_SHA=$(echo $RESPONSE | jq -r '.gitCommitSha // empty')
          echo "buildId=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "gitCommitSha=$GIT_COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
          echo "Git Commit SHA: $GIT_COMMIT_SHA"
          
          if [ -z "$BUILD_ID" ]; then
            echo "❌ ERROR: buildId is missing or empty in response"
            exit 1
          fi
      
      - name: Verify deployment matches current commit
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          BUILD_ID="${{ steps.build_id.outputs.buildId }}"
          GIT_COMMIT_SHA="${{ steps.build_id.outputs.gitCommitSha }}"
          HEALTHZ_BUILD_ID="${{ steps.healthz.outputs.buildId }}"
          
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Build ID from /api/build-id: $BUILD_ID"
          echo "Git Commit SHA from /api/build-id: $GIT_COMMIT_SHA"
          echo "Build ID from /api/healthz: $HEALTHZ_BUILD_ID"
          
          # Check if gitCommitSha matches expected SHA (starts with or equals)
          if [[ "$GIT_COMMIT_SHA" == "$EXPECTED_SHA"* ]] || [[ "$GIT_COMMIT_SHA" == "$EXPECTED_SHA" ]]; then
            echo "✅ SUCCESS: gitCommitSha ($GIT_COMMIT_SHA) matches expected SHA ($EXPECTED_SHA)"
            exit 0
          else
            echo "❌ FAILED: gitCommitSha ($GIT_COMMIT_SHA) does NOT match expected SHA ($EXPECTED_SHA)"
            exit 1
          fi
