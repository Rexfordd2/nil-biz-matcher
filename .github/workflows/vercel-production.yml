name: Vercel Production Deployment

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Pull Vercel environment information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Build project artifacts
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy prebuilt artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /dev/stderr | grep -oP 'https://[^\s]+' | tail -1)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $DEPLOYMENT_URL"
      
      - name: Print deployment info
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Git SHA: ${{ github.sha }}"
          echo "Short SHA: $(echo ${{ github.sha }} | cut -c1-7)"

  verify:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for deployment to propagate
        run: sleep 30
      
      - name: Check /api/healthz
        id: healthz
        run: |
          echo "Fetching https://athlete-ledger.vercel.app/api/healthz"
          RESPONSE=$(curl -s https://athlete-ledger.vercel.app/api/healthz)
          echo "Response: $RESPONSE"
          BUILD_ID=$(echo $RESPONSE | jq -r '.buildId')
          echo "buildId=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID from healthz: $BUILD_ID"
      
      - name: Check /api/build-id
        id: build_id
        run: |
          echo "Fetching https://athlete-ledger.vercel.app/api/build-id"
          RESPONSE=$(curl -s https://athlete-ledger.vercel.app/api/build-id)
          echo "Response: $RESPONSE"
          BUILD_ID=$(echo $RESPONSE | jq -r '.buildId')
          COMMIT=$(echo $RESPONSE | jq -r '.commit')
          echo "buildId=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
          echo "Commit: $COMMIT"
      
      - name: Verify deployment is current
        run: |
          CURRENT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo $CURRENT_SHA | cut -c1-7)
          BUILD_ID="${{ steps.build_id.outputs.buildId }}"
          COMMIT="${{ steps.build_id.outputs.commit }}"
          HEALTHZ_BUILD_ID="${{ steps.healthz.outputs.buildId }}"
          
          echo "Expected short SHA: $SHORT_SHA"
          echo "Build ID from /api/build-id: $BUILD_ID"
          echo "Commit from /api/build-id: $COMMIT"
          echo "Build ID from /api/healthz: $HEALTHZ_BUILD_ID"
          
          # Check if still serving old build
          if [ "$BUILD_ID" = "ac87f4b" ] || [ "$HEALTHZ_BUILD_ID" = "ac87f4b" ]; then
            echo "❌ FAILED: Production is still serving old build (ac87f4b)"
            exit 1
          fi
          
          # Check if build ID matches current commit
          if [[ "$BUILD_ID" == *"$SHORT_SHA"* ]] || [[ "$COMMIT" == *"$SHORT_SHA"* ]] || [[ "$COMMIT" == *"$CURRENT_SHA"* ]]; then
            echo "✅ SUCCESS: Production is serving current commit ($SHORT_SHA)"
            exit 0
          else
            echo "❌ FAILED: Build ID ($BUILD_ID) and commit ($COMMIT) do not match expected SHA ($SHORT_SHA)"
            exit 1
          fi
